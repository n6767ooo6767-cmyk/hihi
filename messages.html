<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OnePlace — Сообщения</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script></head><body><header><a class="brand" href="index.html">🟣 OnePlace</a><a class="ghost" href="index.html">← Кабинет</a></header><main class="wrap"><section class="panel"><p class="eyebrow">АДМИНИСТРАТОР</p><h1>💬 Сообщения</h1><p class="muted">Выбери игрока, напиши сообщение и подтверди отправку.</p><form id="send" class="card"><label>Получатель<select id="who" required></select></label><label>Сообщение<textarea id="body" maxlength="2000" required></textarea></label><button class="primary">Отправить сообщение</button></form><p id="status" class="muted"></p></section></main><script>
const c=supabase.createClient(ONEPLACE_CONFIG.SUPABASE_URL,ONEPLACE_CONFIG.SUPABASE_PUBLISHABLE_KEY),$=x=>document.getElementById(x);
(async()=>{const {data:{user}}=await c.auth.getUser();if(!user){location.href='index.html';return}const {data:p}=await c.from('profiles').select('role').eq('id',user.id).single();if(p?.role!=='admin'){$('status').textContent='Доступ только администратору';return}const {data:users,error}=await c.from('profiles').select('id,username').eq('role','player').order('username');if(error){$('status').textContent=error.message;return}$('who').innerHTML=users.map(x=>'<option value="'+x.id+'">'+String(x.username).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+'</option>').join('')})();
$('send').onsubmit=async e=>{e.preventDefault();if(!confirm('Отправить сообщение выбранному игроку?'))return;const {error}=await c.rpc('admin_send_message',{p_receiver_id:$('who').value,p_message:$('body').value.trim()});$('status').textContent=error?error.message:'Сообщение отправлено!';if(!error)$('body').value=''};
</script></body></html>
