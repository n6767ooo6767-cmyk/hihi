<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OnePlace — Билеты</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script></head><body><header><a class="brand" href="index.html">🟣 OnePlace</a><a class="ghost" href="index.html">← Кабинет</a></header><main class="wrap"><section class="panel"><p class="eyebrow">АДМИНИСТРАТОР</p><h1>🎟️ Создание билетов</h1><form id="make" class="card"><label>Игрок<select id="who" required></select></label><label>Название билета<input id="title" maxlength="80" required></label><label>Цена в игровых деньгах<input id="price" type="number" min="0" max="100000" value="0" required></label><button class="primary">Создать билет</button></form><p id="status" class="muted"></p></section></main><script>
const c=supabase.createClient(ONEPLACE_CONFIG.SUPABASE_URL,ONEPLACE_CONFIG.SUPABASE_PUBLISHABLE_KEY),$=x=>document.getElementById(x);
(async()=>{const {data:{user}}=await c.auth.getUser();if(!user){location.href='index.html';return}const {data:p}=await c.from('profiles').select('role').eq('id',user.id).single();if(p?.role!=='admin'){$('status').textContent='Доступ только администратору';return}const {data:users,error}=await c.from('profiles').select('id,username').eq('role','player').order('username');if(error){$('status').textContent=error.message;return}$('who').innerHTML=users.map(x=>'<option value="'+x.id+'">'+String(x.username).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+'</option>').join('')})();
$('make').onsubmit=async e=>{e.preventDefault();const {error}=await c.rpc('admin_create_ticket',{p_owner_id:$('who').value,p_title:$('title').value.trim(),p_price:Number($('price').value)});$('status').textContent=error?error.message:'Билет создан!';if(!error)e.target.reset()};
</script></body></html>
