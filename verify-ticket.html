<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OnePlace — Проверка билетов</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script></head><body><header><a class="brand" href="index.html">🟣 OnePlace</a><a class="ghost" href="index.html">← Кабинет</a></header><main class="wrap"><section class="panel"><p class="eyebrow">ОХРАНА</p><h1>🛡️ Проверка билета</h1><p class="muted">Введи код билета вручную. После проверки действительный билет будет отмечен использованным.</p><form id="scan" class="card"><label>Код билета<input id="code" required autocomplete="off"></label><button class="primary">Проверить билет</button></form><p id="status" class="muted"></p></section></main><script>
const c=supabase.createClient(ONEPLACE_CONFIG.SUPABASE_URL,ONEPLACE_CONFIG.SUPABASE_PUBLISHABLE_KEY),$=x=>document.getElementById(x);
(async()=>{const {data:{user}}=await c.auth.getUser();if(!user){location.href='index.html';return}const {data:p}=await c.from('profiles').select('role').eq('id',user.id).single();if(!['admin','guard'].includes(p?.role)){$('status').textContent='Доступ только охране';$('scan').hidden=true}})();
$('scan').onsubmit=async e=>{e.preventDefault();const {data,error}=await c.rpc('guard_use_ticket',{p_qr_code:$('code').value.trim()});$('status').textContent=error?error.message:data;$('code').value=''};
</script></body></html>
